# ------------------------------------------------------------------
#  LightShow 2.0
# ------------------------------------------------------------------
# Общий предел частиц за один тик на ВЕСЬ сервер.
# Если шоу идёт несколько — лимит делится между ними, и они автоматически
# прореживаются, а не роняют TPS.
#   слабый сервер / много игроков: 6000-10000
#   обычный:                        20000
#   приватка на друзей:             50000
max-particles-per-tick: 8000

# Каким способом пакеты частиц уходят игрокам:
#   auto        — NMS, если не вышло — ProtocolLib, иначе Bukkit
#   nms         — прямой пакет (быстро, адресно каждому игроку)
#   protocollib — через ProtocolLib (устойчиво к смене версий)
#   bukkit      — запасной путь через API. ВНИМАНИЕ: адресный показ
#                 одному игроку в этом режиме приблизительный, частицы
#                 увидят все, кто рядом.
transport: auto
